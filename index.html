
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123d2b">
  <meta name="description" content="POL BUY — Boutique de vêtements et sport à prix accessibles.">
  <title>POL BUY — Boutique officielle</title>

  <style>
    :root {
      --green: #123d2b;
      --green-light: #205b40;
      --gold: #c7a64b;
      --white: #fff;
      --black: #151515;
      --muted: #777;
      --border: #e6e6e6;
      --background: #f8f8f5;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--white);
      color: var(--black);
      font-family: Arial, Helvetica, sans-serif;
    }

    button, input, textarea, select { font: inherit; }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--green);
      color: white;
      padding: 17px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      box-shadow: 0 3px 14px rgba(0,0,0,.12);
    }

    header h1 {
      margin: 0;
      letter-spacing: 5px;
      color: var(--gold);
      font-size: 27px;
    }

    nav {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    button, .primary-btn {
      cursor: pointer;
      border: 0;
      padding: 12px 16px;
      background: var(--green);
      color: white;
      font-weight: bold;
      border-radius: 4px;
      transition: background .2s, transform .2s;
    }

    button:hover, .primary-btn:hover {
      background: var(--green-light);
    }

    button:active, .primary-btn:active {
      transform: scale(.98);
    }

    .hero {
      text-align: center;
      padding: 75px 15px;
      background:
        linear-gradient(rgba(18,61,43,.92), rgba(18,61,43,.92)),
        #123d2b;
      color: white;
    }

    .hero h2 {
      color: var(--gold);
      font-size: clamp(30px, 5vw, 48px);
      letter-spacing: 7px;
      margin: 0 0 14px;
    }

    .hero p {
      font-size: 16px;
      letter-spacing: 1px;
      margin: 0;
    }

    .hero-line {
      width: 65px;
      height: 3px;
      background: var(--gold);
      margin: 23px auto 0;
    }

    main {
      padding: 42px 5%;
      max-width: 1500px;
      margin: auto;
    }

    .section-heading {
      text-align: center;
      margin-bottom: 30px;
    }

    .section-heading h2 {
      color: var(--green);
      letter-spacing: 2px;
      font-size: 25px;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 14px;
    }

    #product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 22px;
    }

    .product-card {
      border: 1px solid var(--border);
      padding: 13px;
      border-radius: 7px;
      background: white;
      transition: transform .2s, box-shadow .2s;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 22px rgba(0,0,0,.08);
    }

    .product-card img {
      width: 100%;
      height: 260px;
      object-fit: contain;
      cursor: pointer;
      background: var(--background);
      border-radius: 4px;
    }

    .product-card h3 {
      margin: 13px 0 6px;
      font-size: 16px;
      line-height: 1.4;
    }

    .product-card p {
      color: var(--muted);
      font-size: 13px;
      margin: 5px 0 10px;
    }

    .product-card strong {
      color: var(--green);
      font-size: 17px;
    }

    .product-card .primary-btn {
      display: block;
      width: 100%;
      margin-top: 13px;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(0,0,0,.72);
      padding: 18px;
      overflow-y: auto;
    }

    .overlay.show {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .modal {
      background: white;
      width: min(680px, 100%);
      padding: 25px;
      margin: 25px auto;
      border-radius: 9px;
      position: relative;
      box-shadow: 0 15px 50px rgba(0,0,0,.2);
    }

    .close-btn {
      float: right;
      background: #eee;
      color: #111;
      margin-bottom: 12px;
    }

    .close-btn:hover {
      background: #ddd;
    }

    .form-label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
      font-size: 14px;
    }

    .form-field {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: white;
      color: var(--black);
    }

    .form-field:focus {
      outline: 2px solid rgba(199,166,75,.5);
      border-color: var(--gold);
    }

    textarea.form-field {
      min-height: 90px;
      resize: vertical;
    }

    .primary-btn {
      display: inline-block;
      margin-top: 12px;
    }

    .product-detail-image {
      display: block;
      width: 100%;
      max-height: 390px;
      object-fit: contain;
      background: var(--background);
      border-radius: 5px;
      margin-top: 15px;
    }

    .detail-arrows {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 12px 0;
    }

    .detail-arrows span {
      font-size: 13px;
      color: var(--muted);
    }

    #detail-price {
      color: var(--green);
      font-size: 22px;
    }

    #add-to-cart {
      width: 100%;
      padding: 15px;
      background: var(--green);
      margin-top: 20px;
    }

    .cart-line, .admin-order {
      padding: 14px;
      border: 1px solid var(--border);
      margin: 12px 0;
      border-radius: 5px;
      background: #fff;
    }

    .cart-line {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .small-btn {
      background: #eee;
      color: #111;
      align-self: center;
    }

    .notice {
      background: #f7f7f3;
      border-left: 4px solid var(--gold);
      padding: 12px;
      margin: 12px 0;
      line-height: 1.5;
    }

    .account-section {
      border-top: 1px solid var(--border);
      padding: 18px 0;
      margin-top: 18px;
    }

    .account-section h3 {
      color: var(--green);
    }

    .hidden { display: none !important; }

    footer {
      text-align: center;
      background: var(--green);
      color: white;
      padding: 28px 15px;
      margin-top: 40px;
    }

    footer strong {
      color: var(--gold);
      letter-spacing: 3px;
    }

    footer p {
      margin: 7px 0;
      font-size: 13px;
    }

    @media(max-width: 600px) {
      header {
        justify-content: center;
      }

      header h1 {
        width: 100%;
        text-align: center;
      }

      nav {
        justify-content: center;
        width: 100%;
      }

      nav button {
        padding: 10px 12px;
        font-size: 12px;
      }

      main {
        padding: 30px 4%;
      }

      #product-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 11px;
      }

      .product-card {
        padding: 8px;
      }

      .product-card img {
        height: 180px;
      }

      .product-card h3 {
        font-size: 13px;
      }

      .product-card .primary-btn {
        font-size: 11px;
        padding: 10px 5px;
      }

      .modal {
        padding: 16px;
        margin: 8px auto;
      }

      .overlay {
        padding: 8px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>POL BUY</h1>

    <nav>
      <button id="account-open">MON COMPTE</button>
      <button id="cart-open">
        PANIER (<span id="cart-count">0</span>)
      </button>
      <button id="admin-open" class="hidden">ADMIN</button>
    </nav>
  </header>

  <section class="hero">
    <h2>POL BUY</h2>
    <p>Mode, sport et style à prix accessibles.</p>
    <div class="hero-line"></div>
  </section>

  <main>
    <div class="section-heading">
      <h2>NOTRE COLLECTION</h2>
      <p>Découvre les articles disponibles dans notre boutique.</p>
    </div>

    <div id="product-grid"></div>
  </main>

  <!-- FENÊTRE PRODUIT -->
  <div class="overlay" id="product-overlay">
    <div class="modal">
      <button class="close-btn" data-close="product-overlay">
        FERMER
      </button>
      <div id="product-detail"></div>
    </div>
  </div>

  <!-- PANIER -->
  <div class="overlay" id="cart-overlay">
    <div class="modal">
      <button class="close-btn" data-close="cart-overlay">
        FERMER
      </button>

      <h2>Mon panier</h2>
      <div id="cart-items"></div>
      <div id="cart-total"></div>
      <div id="checkout-area"></div>
    </div>
  </div>

  <!-- COMPTE CLIENT -->
  <div class="overlay" id="account-overlay">
    <div class="modal">
      <button class="close-btn" data-close="account-overlay">
        FERMER
      </button>

      <h2>Mon compte</h2>
      <div id="account-content"></div>
    </div>
  </div>

  <!-- ADMINISTRATION -->
  <div class="overlay" id="admin-overlay">
    <div class="modal">
      <button class="close-btn" data-close="admin-overlay">
        FERMER
      </button>

      <h2>Administration POL BUY</h2>
      <div id="admin-content"></div>
    </div>
  </div>

  <footer>
    <strong>POL BUY</strong>
    <p>Boutique en ligne</p>
    <p>Mode, sport et style.</p>
  </footer>

  <script type="module" src="./app.js"></script>

</body>
</html>
