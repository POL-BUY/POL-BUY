
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POL BUY — Boutique</title>
  <style>
    :root {
      --green: #123d2b;
      --gold: #c7a64b;
      --white: #fff;
      --black: #151515;
      --muted: #777;
      --border: #e6e6e6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #fff;
      color: var(--black);
      font-family: Arial, sans-serif;
    }

    header {
      background: var(--green);
      color: white;
      padding: 18px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    header h1 {
      margin: 0;
      letter-spacing: 5px;
      color: var(--gold);
    }

    nav { display: flex; gap: 10px; flex-wrap: wrap; }

    button, .primary-btn {
      cursor: pointer;
      border: 0;
      padding: 12px 16px;
      background: var(--green);
      color: white;
      font-weight: bold;
      border-radius: 4px;
    }

    button:hover, .primary-btn:hover { background: #205b40; }

    .hero {
      text-align: center;
      padding: 55px 15px;
      background: #f7f7f3;
    }

    .hero h2 {
      color: var(--green);
      letter-spacing: 3px;
    }

    main { padding: 30px 5%; }

    #product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 22px;
    }

    .product-card {
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 6px;
    }

    .product-card img {
      width: 100%;
      height: 260px;
      object-fit: contain;
      cursor: pointer;
      background: #f7f7f7;
    }

    .product-card h3 { margin-bottom: 5px; }
    .product-card p { color: var(--muted); }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(0,0,0,.65);
      padding: 18px;
      overflow-y: auto;
    }

    .overlay.show {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .modal {
      background: white;
      width: min(650px, 100%);
      padding: 24px;
      margin: 25px auto;
      border-radius: 8px;
      position: relative;
    }

    .close-btn {
      float: right;
      background: #eee;
      color: #111;
    }

    .form-label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }

    .form-field {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font: inherit;
    }

    textarea.form-field { min-height: 90px; resize: vertical; }

    .primary-btn {
      display: inline-block;
      margin-top: 12px;
    }

    .product-detail-image {
      display: block;
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      background: #f7f7f7;
    }

    .detail-arrows {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
    }

    .cart-line, .admin-order {
      padding: 14px;
      border: 1px solid var(--border);
      margin: 12px 0;
      border-radius: 5px;
    }

    .cart-line {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .small-btn {
      background: #eee;
      color: #111;
      align-self: center;
    }

    .notice {
      background: #f7f7f3;
      border-left: 4px solid var(--gold);
      padding: 12px;
      margin: 12px 0;
    }

    .account-section {
      border-top: 1px solid var(--border);
      padding: 18px 0;
      margin-top: 18px;
    }

    .hidden { display: none !important; }

    footer {
      text-align: center;
      background: var(--green);
      color: white;
      padding: 25px;
      margin-top: 40px;
    }

    @media(max-width: 500px) {
      header { justify-content: center; }
      nav { justify-content: center; }
      .modal { padding: 16px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>POL BUY</h1>
    <nav>
      <button id="account-open">MON COMPTE</button>
      <button id="cart-open">PANIER (<span id="cart-count">0</span>)</button>
      <button id="admin-open" class="hidden">ADMIN</button>
    </nav>
  </header>

  <section class="hero">
    <h2>POL BUY</h2>
    <p>Mode, sport et style.</p>
  </section>

  <main>
    <h2>Nos produits</h2>
    <div id="product-grid"></div>
  </main>

  <!-- FENÊTRE PRODUIT -->
  <div class="overlay" id="product-overlay">
    <div class="modal">
      <button class="close-btn" data-close="product-overlay">FERMER</button>
      <div id="product-detail"></div>
    </div>
  </div>

  <!-- PANIER -->
  <div class="overlay" id="cart-overlay">
    <div class="modal">
      <button class="close-btn" data-close="cart-overlay">FERMER</button>
      <h2>Mon panier</h2>
      <div id="cart-items"></div>
      <div id="cart-total"></div>
      <div id="checkout-area"></div>
    </div>
  </div>

  <!-- COMPTE CLIENT : LA DEMANDE DE PRODUIT EST AFFICHÉE ICI -->
  <div class="overlay" id="account-overlay">
    <div class="modal">
      <button class="close-btn" data-close="account-overlay">FERMER</button>
      <h2>Mon compte</h2>
      <div id="account-content"></div>
    </div>
  </div>

  <!-- ADMIN -->
  <div class="overlay" id="admin-overlay">
    <div class="modal">
      <button class="close-btn" data-close="admin-overlay">FERMER</button>
      <h2>Administration POL BUY</h2>
      <div id="admin-content"></div>
    </div>
  </div>

  <footer>
    <p>POL BUY — Boutique en ligne</p>
  </footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
